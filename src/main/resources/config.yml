# Base command name (e.g., tfmc will create /tfmc)
base-command: tfmc

# ========================================
# COMMANDS - Command structure
# ========================================
# Just list the commands and their hierarchy
# Don't worry about permissions here
# Every entry must match a ConditionalEvents trigger; this plugin only
# suggests commands, it does not run them

commands:

  tips:
    enable: {}
    disable: {}

  pack:
    auto: {}
    manual: {}

  booster: {}
  date: {}
  drinks: {}
  patreon: {}
  statues: {}
  patterns: {}
  masks: {}
  map: {}

  ban:
    <playername>:
      <reason>: {}

  # ConditionalEvents matches these exactly, so they take no arguments
  helper:
    promote: {}
    demote: {}

  helper+:
    promote: {}
    demote: {}

# ========================================
# PERMISSIONS - Who can see commands
# ========================================
# Format:  command-path: permission.node
# Use dots for nested commands (e.g., helper.promote)
# Leave out commands that everyone can see (e.g., date)
# Keep these in step with the permission checks in ConditionalEvents

# Multiple permissions (player needs ANY of them):
# command: [permission1, permission2, permission3]

permissions:
  ban: tfmc.helper

  helper: [helper.promote, helper.demote]
  helper.promote: helper.promote
  helper.demote: helper.demote

  helper+: [helper+.promote, helper+.demote]
  helper+.promote: helper+.promote
  helper+.demote: helper+.demote
